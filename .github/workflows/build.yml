name: Build CarbonSpigot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B -U clean package -DskipTests

      - name: Upload CarbonSpigot jar
        uses: actions/upload-artifact@v4
        with:
          name: CarbonSpigot
          path: |
            Carbon-Server/target/*.jar
            !Carbon-Server/target/original-*.jar
          if-no-files-found: error
